# Copy to .streamlit/secrets.toml (git-ignored) to enable the AI Assistant.
# Or set the same names as environment variables instead.
# Never put a real key in this example file: it is meant to be shared.
# Use ONE provider. OpenAI (default model gpt-4.1-mini):
OPENAI_API_KEY = "sk-proj-..."
# Or Anthropic (default model claude-opus-5-5):
# ANTHROPIC_API_KEY = "sk-ant-..."
# Optional overrides:
# CAMPUS_CRUISE_LLM_PROVIDER = "openai"   # or "anthropic"
# CAMPUS_CRUISE_LLM_MODEL = "gpt-4.1-mini"
